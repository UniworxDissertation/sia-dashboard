name: Build and deploy Django backend to Azure Web App - sia-api

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/master_sia-api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies and validate Django
        working-directory: backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py check

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: django-backend
          path: |
            backend
            !backend/antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: django-backend

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8D8DAA8B7B6C4EC6A986558B2220C57D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_35193E0F2074412A920BF569BF1C0F17 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BA2FEFE59DED4570A99A314672C61856 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'sia-api'
          slot-name: 'Production'
          package: .